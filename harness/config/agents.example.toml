# FSE paper closeout (2026-09-20): author-confirmed interaction limit is 150.
# Profiles below include historical protocols; their stored 120-step values
# are not the current paper budget. Set openhands_max_steps = 150 explicitly
# in the selected reproduction profile; retain other protocol settings.

# FeatureLiftBench shared agent config.
# Secrets live in .env (never commit .env).
#
# Fresh clone: ./setup.sh creates harness/config/agents.toml from this file
# and installs OpenHands (opt-in), DeepSeek Harness, and Codex CLIs.
# Select models with the profile option in ./scripts/run_benchmark.sh.
#
# Official Main uses OpenHands profiles (openhands_*). DeepSeek Harness / Codex
# are the same CLI level (`--agent openhands|deepseek-harness|codex`). Runtime
# scores stay off the Python-200 Main table. See docs/METHOD_AGENT_RUNTIME.md.

profile = "deepseek_v4_pro"
env_file = ".env"

[profiles.deepseek_v4_pro]
model = "deepseek/deepseek-v4-pro"
agent_bin = "mini"
api_key_env = "FEATURELIFTBENCH_API_KEY"
api_base_env = "FEATURELIFTBENCH_API_BASE"
cost_limit = "0"
call_limit = "0"

[profiles.deepseek_v4_flash]
model = "deepseek/deepseek-v4-flash"
agent_bin = "mini"
api_key_env = "FEATURELIFTBENCH_API_KEY"
api_base_env = "FEATURELIFTBENCH_API_BASE"
cost_limit = "0"
call_limit = "0"

# Opt-in Repository Semantic Graph profiles. These can be used with
# mini-swe-agent, OpenHands, or FeatureLiftAgent; existing profiles stay disabled.
#
# Design v2 formal OpenHands surface: optional search|inspect|support
# (bootstrap = tool_only). Legacy repo_graph_mode still enables the graph.
[profiles.deepseek_v4_flash_rsg_tool_only]
model = "deepseek/deepseek-v4-flash"
agent_bin = "mini"
api_key_env = "FEATURELIFTBENCH_API_KEY"
api_base_env = "FEATURELIFTBENCH_API_BASE"
cost_limit = "0"
call_limit = "0"
repo_graph_mode = "static"
repo_graph_transport = "cli"
repo_graph_fail_fast = true
rsg_bootstrap = "tool_only"
rsg_view = "operational_support"
rsg_budget_tokens = 8000
rsg_inspect_max_chars = 4000
repo_graph_query_max_chars = 12000

