# ./setup.sh installs pinned dsh/codex into third_party/runtimes/bin.
# Pair against OpenHands+Flash Main on Core-12 first.
# Pins: harness/config/runtime_pins.json

[profiles.dsh_deepseek_v4_flash_main]
model = "deepseek/deepseek-v4-flash"
api_key_env = "FEATURELIFTBENCH_API_KEY"
api_base_env = "FEATURELIFTBENCH_API_BASE"
cost_limit = "0"
call_limit = "0"
mount_public_tests = false
prompt_style = "standard"
expose_source_hints = false
source_context = "full_repository"

[profiles.codex_deepseek_v4_flash_main]
model = "deepseek-v4-flash"
api_key_env = "FEATURELIFTBENCH_API_KEY"
api_base_env = "FEATURELIFTBENCH_API_BASE"
cost_limit = "0"
call_limit = "0"
mount_public_tests = false
prompt_style = "standard"
expose_source_hints = false
source_context = "full_repository"

[profiles.codex_gpt_main]
model = "gpt-5"
api_key_env = "OPENAI_API_KEY"
api_base_env = "OPENAI_BASE_URL"
cost_limit = "0"
call_limit = "0"
mount_public_tests = false
prompt_style = "standard"
expose_source_hints = false
source_context = "full_repository"

[profiles.default]
model = "openai/gpt-5.4-mini"
agent_bin = "mini"
api_key_env = "FEATURELIFTBENCH_API_KEY"
api_base_env = "FEATURELIFTBENCH_API_BASE"
cost_limit = "10.00"
call_limit = "0"

[profiles.openai_compatible]
model = "openai/gpt-5.4-mini"
agent_bin = "mini"
api_key_env = "FEATURELIFTBENCH_API_KEY"
api_base_env = "FEATURELIFTBENCH_API_BASE"
cost_limit = "10.00"
call_limit = "0"
