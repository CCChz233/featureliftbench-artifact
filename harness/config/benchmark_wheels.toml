# Canonical pinned specs for benchmark task requirements.lock entries.
# Used by bootstrap_vendor_wheels.py and sync_task_locks tooling.

[sanity]
text-unidecode = "text-unidecode==1.3"

[packages]
attrs = "attrs==24.2.0"
annotated-types = "annotated-types==0.7.0"
antlr4-python3-runtime = "antlr4-python3-runtime==4.9.3"
blinker = "blinker==1.8.2"
certifi = "certifi==2026.6.17"
cffi = "cffi==1.17.1"
charset-normalizer = "charset-normalizer==3.4.7"
click = "click==8.1.7"
cryptography = "cryptography==43.0.3"
filelock = "filelock==3.16.1"
flask = "Flask==3.0.3"
idna = "idna==3.18"
itsdangerous = "itsdangerous==2.2.0"
jinja2 = "Jinja2==3.1.4"
jsonschema-specifications = "jsonschema-specifications==2024.10.1"
language-data = "language-data==1.3.0"
marisa-trie = "marisa-trie==1.3.1"
markupsafe = "MarkupSafe==2.1.5"
marshmallow = "marshmallow==3.22.0"
mdurl = "mdurl==0.1.2"
msgpack = "msgpack==1.1.0"
multidict = "multidict==6.0.4"
orderedmultidict = "orderedmultidict==1.0.1"
ply = "ply==3.11"
portalocker = "portalocker==3.2.0"
propcache = "propcache==0.4.1"
pycparser = "pycparser==2.22"
pympler = "Pympler==1.1"
pydantic = "pydantic==2.9.2"
pydantic-core = "pydantic_core==2.23.4"
pyjwt = "PyJWT==2.13.0"
pytz = "pytz==2025.2"
python-dateutil = "python-dateutil==2.9.0.post0"
pyyaml = "PyYAML==6.0.2"
referencing = "referencing==0.35.1"
regex = "regex==2024.11.6"
requests = "requests==2.32.3"
requests-file = "requests-file==2.1.0"
rpds-py = "rpds-py==0.20.0"
six = "six==1.17.0"
sortedcontainers = "sortedcontainers==2.4.0"
tenacity = "tenacity==8.2.3"
tzdata = "tzdata==2024.2"
tzlocal = "tzlocal==5.3.1"
typing-extensions = "typing_extensions==4.12.2"
typing-inspect = "typing-inspect==0.9.0"
typing-inspection = "typing-inspection==0.4.2"
urllib3 = "urllib3==2.7.0"
watchdog = "watchdog==6.0.0"
wcwidth = "wcwidth==0.2.13"
webencodings = "webencodings==0.5.1"
werkzeug = "Werkzeug==3.0.3"
wrapt = "wrapt==1.16.0"
lazy-object-proxy = "lazy-object-proxy==1.12.0"

[transitive]
python-dateutil = ["six"]
language-data = ["marisa-trie"]
cryptography = ["cffi"]
cffi = ["pycparser"]
flask = ["werkzeug", "jinja2", "itsdangerous", "click", "blinker"]
jinja2 = ["markupsafe"]
werkzeug = ["markupsafe"]
requests-file = ["requests"]
orderedmultidict = ["six"]
pydantic = ["pydantic-core", "annotated-types", "typing-extensions", "typing-inspection"]
referencing = ["attrs"]
jsonschema-specifications = ["referencing", "rpds-py", "attrs"]
requests = ["charset-normalizer", "idna", "urllib3", "certifi"]

[source_build]
# This release predates PyPI wheels but builds a platform-independent wheel.
antlr4-python3-runtime = true

[aliases]
# metadata allowed_dependencies may use short names; lock uses PyPI distribution names.
rpds = "rpds-py"
